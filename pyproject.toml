[project]
name = "semif-segmentation"
version = "0.1.0"
description = "Vegetation vs. background segmentation for SemiField and field images"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  # torch comes from the CUDA 12.6 index below (x86_64 and aarch64 wheels), as in agir-pipeline
  "torch>=2.6",
  "torchvision>=0.21",   # pulled in by timm/smp; pinned to the same index as torch
  "segmentation-models-pytorch>=0.5.0",
  "pytorch-lightning>=2.5.5",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "albumentations>=2.0.8",
  "opencv-python-headless>=4.12.0.88",
  "numpy>=2.2.6",
  "pandas>=2.3.1",
  "matplotlib>=3.10.3",
  "tqdm>=4.67.1",
  "requests>=2.32.4",
  "pyyaml>=6.0.2",
  "pycocotools>=2.0.8",
  "torchmetrics>=1.9.0",
]

[project.optional-dependencies]
# SAM 3 proposals / pseudo-instances (src/models/proposals/sam3.py, conf/proposals/sam3.yaml): uv sync --extra sam3
sam3 = [
  "sam3 @ git+https://github.com/facebookresearch/sam3@2345a4ad109ac29c569da749c91d84f10dc08c40",
  "setuptools<81",  # sam3 imports pkg_resources, removed in setuptools 81
  "einops",         # imported by sam3 but not in its dependencies
  "psutil",         # ditto
  "fvcore",         # sam3.train (fine-tuning, src/sam3_finetune.py): param schedulers
  "tensorboard",    # sam3.train: training logs
]

[dependency-groups]
dev = ["pytest>=8.4.2"]

[tool.uv]
package = false   # run from the repo root (python main.py ...); src/ isn't installed
# sam3 pins numpy<2 but runs on numpy 2 (checked with 2.5); keep the repo's numpy
override-dependencies = ["numpy>=2.2.6"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
