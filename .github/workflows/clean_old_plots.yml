name: Cleanup Old Metrics Plots

on:
  schedule:
    - cron: '0 3 * * 1'  # every Monday at 3AM UTC

jobs:
  clean:
    runs-on: self-hosted

    steps:
      - name: Checkout training-artifacts branch
        uses: actions/checkout@v4
        with:
          ref: training-artifacts

      - name: Remove metrics_*.png files older than 7 days
        run: |
          echo "🔍 Looking for old metrics plots..."
          find assets/ -name 'metrics_*.png' -mtime +7 -print -exec git rm {} \;

      - name: Commit and push deletions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "🧹 Cleanup old metrics plots" || echo "No plots to remove"
          git push origin training-artifacts
