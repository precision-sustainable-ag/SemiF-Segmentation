name: Segmentation Pipeline (Self-Hosted)

on:
  push:
    branches:
      - develop
jobs:
  run_pipeline:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Conda environment
        run: |
          source ~/miniconda3/etc/profile.d/conda.sh
          conda activate torch

      - name: Sync data (only if config or batch list changes)
        if: ${{ !contains(github.event.head_commit.message, 'TRAIN_ONLY') }}
        run: |
          python main.py mode=sync

      - name: Query (only if query config changes)
        if: ${{ !contains(github.event.head_commit.message, 'TRAIN_ONLY') }}
        run: |
          python main.py mode=query

      - name: Preprocess (only if preprocessing config or augmentations change)
        if: ${{ !contains(github.event.head_commit.message, 'TRAIN_ONLY') }}
        run: |
          python main.py mode=preprocess

      - name: Train
        run: |
          python main.py mode=train

      - name: Read version directory and project from run_info.json
        id: load_version
        run: |
          VERSION_DIR=$(jq -r .version_dir logs/run_info.json)
          PROJECT_NAME=$(jq -r .project_name logs/run_info.json)
          echo "VERSION_DIR=$VERSION_DIR"
          echo "PROJECT_NAME=$PROJECT_NAME"
          echo "VERSION_DIR=$VERSION_DIR" >> $GITHUB_ENV
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
        
      - name: Push metrics plot to training-artifacts branch
        run: |
          IMAGE_NAME="metrics_${GITHUB_RUN_ID}.png"
          IMAGE_PATH="assets/$IMAGE_NAME"

          mkdir -p assets
          cp "$VERSION_DIR/metrics.png" "$IMAGE_PATH"

          # Setup Git identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 🧹 Remove stale worktree registration if it exists
          if git worktree list | grep -q 'artifacts_worktree'; then
            echo "🧹 Removing stale registered worktree"
            git worktree remove --force artifacts_worktree || git worktree prune
          fi

          # Set up worktree
          if git ls-remote --exit-code origin training-artifacts; then
            echo "✅ Remote branch exists, using it"
            git fetch origin training-artifacts:refs/remotes/origin/training-artifacts
            git worktree add artifacts_worktree origin/training-artifacts
          else
            echo "🚧 Remote branch does not exist, creating new orphan branch"
            git worktree add -b training-artifacts artifacts_worktree
            cd artifacts_worktree
            git commit --allow-empty -m "Initialize training-artifacts branch"
            git push origin training-artifacts
            cd ..
          fi

          # Copy image and commit
          mkdir -p artifacts_worktree/assets
          cp "$IMAGE_PATH" artifacts_worktree/assets/

          cd artifacts_worktree
          git add "assets/$IMAGE_NAME"
          git commit -m "Add metrics plot for run $GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/training-artifacts
          cd ..

          # Clean up worktree
          git worktree remove artifacts_worktree

      - name: Create GitHub issue with training metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: |
          python scripts/create_training_issue.py

      - name: Cleanup logs and artifacts
        if: ${{ success() }}
        run: |
          echo "Cleaning up logs and artifacts..."
          rm -rf logs/