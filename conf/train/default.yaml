mode: train
epochs: 50
batch_size: 4
seed: 42
augment: default
class_mode: multiclass # multiclass or binary
out_classes: 3


loss:
  name: DiceBCELoss # smpDiceLoss, DiceFocalLoss, DiceBCELoss, DiceWithBoundaryLoss, DiceCrossEntropy

lr:
  base_lr: 0.001

train_strategy: ddp # auto or ddp

cuda_visible_devices: [5,6]

dataset:
  normalize: true
  workers: 16

trainer:
  max_epochs: ${train.epochs}
  enable_progress_bar: true
  log_every_n_steps: 1
  enable_model_summary: true
  num_sanity_val_steps: 0
  deterministic: true  # true for binary, false for multiclass
  
callbacks:
  monitor: valid_dataset_iou
  mode: max
  save_top_k: 1
  save_last: true
