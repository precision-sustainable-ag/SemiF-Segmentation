mode: train
epochs: 50
batch_size: 12
augment: basic

train_strategy: ddp # auto or ddp

cuda_visible_devices: [1,2]

trainer:
  max_epochs: ${train.epochs}
  enable_progress_bar: true
  log_every_n_steps: 1
  enable_model_summary: true
  num_sanity_val_steps: 0
  deterministic: false  # true for binary, false for multiclass
  
callbacks:
  monitor: valid_dataset_iou
  mode: max
  save_top_k: 1
  save_last: true
