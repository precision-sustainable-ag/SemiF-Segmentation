mode: train
epochs: 50
batch_size: 16
seed: 42
augment: default
class_mode: binary # multiclass or binary
out_classes: 1 # 1 for binary, 3 for multiclass
class_names: [background, vegetation] # mask value -> name, for plots and data stats


loss:
  name: smpDiceLoss # smpDiceLoss, DiceFocalLoss, DiceBCELoss, DiceWithBoundaryLoss, DiceCrossEntropy

lr:
  base_lr: 0.001

train_strategy: ddp # auto or ddp

cuda_visible_devices: [5,6]

dataset:
  normalize: true
  workers: 16

trainer:
  max_epochs: ${train.epochs}
  enable_progress_bar: true
  log_every_n_steps: 1
  enable_model_summary: true
  num_sanity_val_steps: 0
  deterministic: true  # true for binary, false for multiclass
  
callbacks:
  monitor: valid_dataset_iou
  mode: max
  save_top_k: 1
  save_last: true

sample_predictions:       # after training: best model's predictions on test tiles, next to their labels
  n_test_tiles: 24        # 3/4 with vegetation, 1/4 mostly bare, spread over the test images (0 = none)
  min_vegetation: 0.01    # a tile "has vegetation" above this fraction of pixels
  seed: 42

sample_inference: []      # optional unlabeled images (paths under paths.persistent_dir) to predict on after training
