# path to root directory
# this relys on main.py to be run from the project root
root_dir: ${hydra:runtime.cwd}
persistent_dir: /home/mkutuga/SemiF-Segmentation

project_dir: ${paths.persistent_dir}/projects/${project.name}
project_mode_dir: ${paths.project_dir}/${mode}
project_preprocess_dir: ${paths.project_dir}/preprocess
project_train_dir: ${paths.project_dir}/train
project_inference_dir: ${paths.project_dir}/inference

# path to data directory
data_dir: ${paths.persistent_dir}/data

inference_output_dir: ${paths.project_inference_dir}/${inference.inference.inference_subname}/version_${inference.inference.version}

# preprocess outputs: the dataset manifest and its train/val/test tiles
dataset_manifest: ${paths.project_preprocess_dir}/data/manifest.csv
tile_suffix: ${preprocess.tile.tile_size}px_scale${preprocess.tile.scale}
split_dir: ${paths.project_preprocess_dir}/data/tiles_${paths.tile_suffix}

inference:
  checkpoints: ${paths.project_train_dir}/version_${inference.inference.version}/checkpoints

# Labeling rounds (mode=label): the local label store
labels_dir: ${paths.data_dir}/labels
labels_db: ${paths.labels_dir}/labels.db                    # one row per image pulled into any round
source_db_dir: ${paths.labels_dir}/source_db                # local snapshots of the source DBs
label_images_dir: ${paths.labels_dir}/images                # full-resolution images, <source>/<image_id>.jpg
label_cvat_images_dir: ${paths.labels_dir}/cvat_images      # downscaled copies uploaded to CVAT, <round>/<image_id>.jpg
label_prelabels_dir: ${paths.labels_dir}/prelabels          # model masks at CVAT resolution, <round>/<image_id>.png (0/255)
label_cvat_masks_dir: ${paths.labels_dir}/cvat_masks        # human masks at CVAT resolution, <source>/<image_id>.png (0/1)
label_masks_dir: ${paths.labels_dir}/masks                  # human masks at native resolution, <source>/<image_id>.png (0/1)
