tasks:
  inference: true

inference:
  explicit_img_dir:
    enable: true
    img_dir: data/non_green_Field_sample
    # img_dir: data/rye_vetch/biomass-data/images
  bbox_crop: false # Not compatible with synthetic data
  inference_subname: non_green_Field_sample
  # inference_subname: hairy_vetch_pm3d
  version: 1 # Uses cfg.project.name to find the model
  rescale_factor: ${preprocess.tile.scale} # match the scale the model was trained at
  threshold: 0.95
  use_normalization: true
  cuda_visible_devices: [9]
  seed: 422

  plot:
    overlays: false
    comparisons: false
    image_and_mask: false
    dpi: 300
    transparent: true

  mean: # default values if no rgb_std.json in the datastats project folder exists
    - 0.34294407046243913
    - 0.32145567842088424
    - 0.28347563540363635
  std:
    - 0.18942575591144425
    - 0.19259909206363238
    - 0.17072289022513365
