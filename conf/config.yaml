defaults:
  - paths: default           # Default paths config
  - queries: default           # Default queries config
  - preprocess: default          # Default training config
  - augment: default  # Default augmentations config
  - model: deeplabv3plus         # Model config
  - train: default         # Train config
  - inference: default      # Inference config
  
  - _self_                   # Ensures overriding behavior

project:
  name: LARGE_Hairy_Vetch

mode: ??? # required argument for command line. Either preprocess, train, or inference

job_now_date: &nowdir ${now:%Y-%m-%d}
job_now_time: &nowtime ${now:%H:%M:%S}


hydra:
  run:
    dir: ${paths.project_mode_dir}/hydra/${job_now_date}_${job_now_time}  # Dynamically set the directory based on task
  # output_subdir: "default"