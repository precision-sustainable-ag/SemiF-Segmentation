train:
  img_hw: ["${preprocess.grid_crop.crop_height}", "${preprocess.grid_crop.crop_width}"]

  geometrics_transforms:
    horizontal_flip:
      enable: true
      p: 1.0
    vertical_flip:
      enable: true
      p: 1.0
    affine:
      enable: false
    padding:
      enable: false
      p: 1.0
    random_crop:
      enable: true
      p: 1.0
    perspective:
      enable: false
    optical_distortion:
      enable: false

  photometrics_transforms:
    rgb_shift:
      enable: true
      r_shift_limit: 20
      g_shift_limit: 20
      b_shift_limit: 20
      p: 1.0
    random_gamma:
      enable: true
      gamma_limit: [80,120]
      p: 1.0
    to_gray:
      enable: true
      p: 1.0
    channel_shuffle:
      enable: true
      p: 1.0
    invert_image:
      enable: true
      p: 1.0
    color_jitter:
      enable: true
      p: 1.0
    huesatval:
      enable: true
      hue_shift_limit: 30
      sat_shift_limit: 40
      val_shift_limit: 30
      p: 1.0
    clahe:
      enable: true
      clip_limit: 4.0
      tile_grid_size: [8, 8]
      p: 1.0
    brightness_contrast:
      enable: true
      p: 1.0
    equalize:
      enable: true
      p: 1.0
    random_tone_curve:
      enable: true
      p: 1.0
      
  noise_transforms:
    enable: false
    one_of_p: 1.0
    transforms:
      MultiplicativeNoise:
        multiplier: [0.9, 1.1]
        per_channel: true
        p: 0.15
      ISONoise:
        color_shift_min: 0.01
        color_shift_max: 0.1
        intensity_min: 0.1
        intensity_max: 0.5
        p: 0.15
      JpegCompression:
        quality_lower: 10
        quality_upper: 70
        p: 0.15

val:
  img_hw: ${augment.train.img_hw}
  padding:
    enable: false
    p: 0.0