train:
  img_hw: [512, 512]
  
  horizontal_flip: 
    enable: true
    p: 0.45

  vertical_flip: 
    enable: true
    p: 0.45

  affine: # https://albumentations.ai/docs/api_reference/augmentations/geometric/transforms/#albumentations.augmentations.geometric.transforms.Affine
    enable: false
    scale: 0.1 # Scaling factor to use, where 1.0 denotes "no change" and 0.5 is zoomed out to 50 percent of the original size
    translate_percent: 0.5 # Translation as a fraction of the image height/width (x-translation, y-translation), where 0 denotes "no change" and 0.5 denotes "half of the axis size".
    translate_px: 
    rotate: [-180, 180]
    shear: 0
    interpolation: 0 
    mask_interpolation: 0 
    fit_output: True
    keep_ratio: True
    rotate_method: largest_box
    balanced_scale: True
    border_mode: 0
    fill: 0.0
    fill_mask: 0.0
    p: 0.15

  optical_distortion: 
    enable: false
    distort_limit: [-0.05, 0.05]
    p: 0.15

  padding: 
    enable: false
    p: 0.15

  random_crop: 
    enable: false
    p: 0.05

  gauss_noise: 
    enable: true  # Enable noise to simulate sensor variations
    noise_scale_factor: 0.3  # Increased scale factor for stronger effect
    p: 0.2 

  perspective: 
    enable: false
    scale: [0.05, 0.1]
    p: 0.15

  # Color adjustments
  color_transforms:
    enable: true  # Enable color transformations
    transforms:
      - CLAHE
      - RandomGamma
    p: 0.3  # Increase probability

  # Blurring effects to simulate different focus conditions
  blur_transforms:
    enable: true
    transforms:
      - Sharpen
      - Blur
      - MotionBlur
    blur_limit: 3
    p: 0.2  # Slightly increase probability

  # Lighting & color variations
  hue_saturation:
    enable: true
    transforms:
      - RandomBrightnessContrast
      - HueSaturationValue
    brightness_limit: [-0.3, 0.3]  # Increase brightness variation range
    contrast_limit: [-0.3, 0.3]  
    hue_shift_limit: [-40, 40]  # Increase hue variation range
    sat_shift_limit: [-40, 40]
    val_shift_limit: [-40, 40]
    p: 0.95  # Increase probability significantly

  # Noise to simulate different lighting conditions and sensor artifacts
  noise_transforms:
    enable: true
    one_of_p: 0.6  # Increase the probability of noise application
    transforms:
      GaussNoise:
        mean_range_min: -0.01 # Range for noise mean as a fraction of the maximum value (255 for uint8 images or 1.0 for float images). Values should be in range [-1, 1]. Default: (0.0, 0.0).
        mean_range_max: 0.01 
        noise_scale_factor: 0.02
        per_channel: false
        p: 0.5
      ISONoise:
        color_shift_min: 0.2
        color_shift_max: 0.4  # Increase color shift
        intensity_min: 0.2
        intensity_max: 0.4
        p: 0.5

val:
  img_hw: ${augment.train.img_hw}
  padding:
    enable: false
    p: 0.25
