# explore transformations at https://explore.albumentations.ai/
train:
  img_hw: [1024, 1024]
  
  horizontal_flip: 
    enable: true
    p: 0.15

  vertical_flip: 
    enable: true
    p: 0.15

# https://albumentations.ai/docs/api_reference/augmentations/geometric/transforms/#albumentations.augmentations.geometric.transforms.OpticalDistortion
  optical_distortion: 
    enable: true
    distort_limit: [-0.05,0.05]
    p: 0.15
  
  # https://albumentations.ai/docs/api_reference/augmentations/geometric/transforms/#albumentations.augmentations.geometric.transforms.ShiftScaleRotate
  shift_scale_rotate:
    enable: true
    scale_limit: [-0.1,0.1]
    rotate_limit: [-180,180]
    shift_limit: [-0.0625,0.0625]
    border_mode: 0
    p: 0.15
  
  padding: 
    enable: false
    p: 0.15

  random_crop: 
    enable: true
    p: 0.05
  
  gauss_noise: 
    enable: true
    noise_scale_factor: .2 # Scaling factor for noise generation. Value should be in the range (0, 1]. Smaller is faster.
    p: 0.15 
  
  # https://albumentations.ai/docs/api_reference/augmentations/geometric/transforms/#albumentations.augmentations.geometric.transforms.Perspective
  perspective: 
    enable: true
    scale: [0.05, 0.1]
    p: 0.15

  color_transforms:
    enable: true
    transforms:
      - CLAHE
      - RandomBrightnessContrast
      - RandomGamma
    p: 0.15
  
  blur_transforms:
    enable: true
    transforms:
      - Sharpen # https://albumentations.ai/docs/api_reference/augmentations/transforms/?h=sharpen#albumentations.augmentations.transforms.Sharpen
      - Blur
      - MotionBlur # https://albumentations.ai/docs/api_reference/full_reference/?h=motion+blur#albumentations.augmentations.blur.transforms.MotionBlur
    blur_limit: 3
    p: 0.15
  
  hue_saturation:
    enable: true
    transforms:
      - RandomBrightnessContrast
      - HueSaturationValue
    brightness_limit: [-0.2,0.2]
    contrast_limit: [-0.2,0.2]  
    hue_shift_limit: [-20,20]
    sat_shift_limit: [-30,30]
    val_shift_limit: [-20,20]
    p: 0.15

val:
  img_hw: ${augment.train.img_hw}
  padding:
    enable: false
    p: 0.25
